<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Shaqran Hussain</title>
    <link rel="icon" type="image/png" href="assets/images/favicon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #000000;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Animated Background */
        .bg-gradient {
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 80% 50% at 50% -20%, rgba(0, 217, 255, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse 60% 40% at 100% 50%, rgba(124, 58, 237, 0.1) 0%, transparent 50%),
                radial-gradient(ellipse 60% 40% at 0% 80%, rgba(0, 102, 255, 0.08) 0%, transparent 50%);
            z-index: -1;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            animation: float 15s ease-in-out infinite;
        }

        .orb-1 {
            width: 400px;
            height: 400px;
            background: rgba(0, 217, 255, 0.15);
            top: 10%;
            right: 10%;
        }

        .orb-2 {
            width: 300px;
            height: 300px;
            background: rgba(124, 58, 237, 0.12);
            bottom: 10%;
            left: 10%;
            animation-delay: -7s;
        }

        @keyframes float {

            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }

            50% {
                transform: translate(30px, -30px) scale(1.05);
            }
        }

        .container {
            text-align: center;
            padding: 40px;
            max-width: 600px;
        }

        .error-code {
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(8rem, 25vw, 15rem);
            font-weight: 700;
            background: linear-gradient(135deg, #00d9ff 0%, #0066ff 50%, #7c3aed 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
            margin-bottom: 20px;
            animation: glitch 3s ease-in-out infinite;
        }

        @keyframes glitch {

            0%,
            90%,
            100% {
                filter: none;
                transform: translate(0);
            }

            92% {
                filter: hue-rotate(90deg);
                transform: translate(-2px, 2px);
            }

            94% {
                filter: hue-rotate(-90deg);
                transform: translate(2px, -2px);
            }

            96% {
                filter: none;
                transform: translate(-1px, -1px);
            }

            98% {
                filter: hue-rotate(45deg);
                transform: translate(1px, 1px);
            }
        }

        .error-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 16px;
            color: #ffffff;
        }

        .error-message {
            font-size: 1.1rem;
            color: #a1a1aa;
            line-height: 1.7;
            margin-bottom: 40px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 16px 36px;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            border-radius: 50px;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            background: linear-gradient(135deg, #00d9ff 0%, #0066ff 50%, #7c3aed 100%);
            color: white;
            box-shadow: 0 0 40px rgba(0, 217, 255, 0.3);
        }

        .btn:hover {
            transform: translateY(-4px) scale(1.05);
            box-shadow: 0 0 60px rgba(0, 217, 255, 0.5);
        }

        .links {
            margin-top: 40px;
            display: flex;
            justify-content: center;
            gap: 24px;
        }

        .links a {
            color: #71717a;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.3s;
        }

        .links a:hover {
            color: #00d9ff;
        }

        /* Floating particles */
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #00d9ff;
            border-radius: 50%;
            opacity: 0.3;
            animation: rise 20s linear infinite;
        }

        @keyframes rise {
            0% {
                transform: translateY(100vh) scale(0);
                opacity: 0;
            }

            10% {
                opacity: 0.3;
            }

            90% {
                opacity: 0.3;
            }

            100% {
                transform: translateY(-100vh) scale(1);
                opacity: 0;
            }
        }
    </style>
</head>

<body>
    <div class="bg-gradient"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <!-- Particles -->
    <div class="particle" style="left: 10%; animation-delay: 0s;"></div>
    <div class="particle" style="left: 25%; animation-delay: -3s;"></div>
    <div class="particle" style="left: 40%; animation-delay: -6s;"></div>
    <div class="particle" style="left: 55%; animation-delay: -9s;"></div>
    <div class="particle" style="left: 70%; animation-delay: -12s;"></div>
    <div class="particle" style="left: 85%; animation-delay: -15s;"></div>

    <div class="container">
        <div class="error-code">404</div>
        <h1 class="error-title">Page Not Found</h1>
        <p class="error-message">
            Oops! The page you're looking for seems to have wandered off into the void.
            Let's get you back on track.
        </p>
        <a href="index.html" class="btn">
            <i class="fas fa-home"></i>
            Back to Home
        </a>
        <div class="links">
            <a href="index.html#about">About</a>
            <a href="index.html#projects">Projects</a>
            <a href="index.html#contact">Contact</a>
            <a href="https://github.com/Shaqran92" target="_blank">GitHub</a>
        </div>
    </div>
</body>

</html>
